<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronic Travel — Admin panel</title>
<style>
:root{--green:#04272B;--gold:#D4AF37;--gold2:#e5c463;--bg:#f4f6f6;--card:#fff;--ink:#16302f;--muted:#65746f;--line:#e2e7e6;--danger:#e5645f;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.btn--gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--green)}
.btn--gold:hover{filter:brightness(1.05)}
.btn--ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn--ghost:hover{border-color:var(--gold)}
.btn--danger{background:transparent;border:1.5px solid #f0c9c7;color:var(--danger)}
.btn--danger:hover{background:var(--danger);color:#fff}
.btn--sm{padding:7px 12px;font-size:.85rem;border-radius:8px}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
label{display:block;font-weight:600;font-size:.85rem;margin:0 0 5px}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(160deg,#053b3b,var(--green) 55%,#021a1a)}
.login__box{background:#fff;border-radius:18px;padding:34px 30px;width:min(400px,100%);box-shadow:0 30px 70px rgba(0,0,0,.3)}
.login__logo{text-align:center;font-family:'Playfair Display',serif;font-weight:800;font-size:1.5rem;color:var(--green);margin-bottom:4px}
.login__logo span{color:var(--gold)}
.login__sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:24px}
.field{margin-bottom:16px}
.msg{font-size:.85rem;margin-top:10px;min-height:18px}
.msg--err{color:var(--danger)}
.msg--ok{color:#1f9d55}

/* App */
.top{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top__logo{font-family:'Playfair Display',serif;font-weight:800;font-size:1.2rem}
.top__logo span{color:var(--gold)}
.top__right{display:flex;align-items:center;gap:14px;font-size:.9rem}
.wrap{max-width:1050px;margin:0 auto;padding:22px 18px 60px}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:30px;background:#fff;border:1.5px solid var(--line);font-weight:700;cursor:pointer;font-size:.92rem}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-head h2{font-family:'Playfair Display',serif;color:var(--green);font-size:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}

/* Tours list */
.tour-item{display:flex;gap:14px;align-items:center}
.tour-item img{width:76px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.tour-item__info{flex:1;min-width:0}
.tour-item__info b{color:var(--green)}
.tour-item__price{color:var(--gold);font-weight:800}
.tour-item__actions{display:flex;gap:6px;flex:none}
.muted{color:var(--muted);font-size:.85rem}

/* Orders table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.badge--new{background:#fef3c7;color:#92620a}
.badge--done{background:#d1fae5;color:#065f46}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(4,20,20,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal__box{background:#fff;border-radius:16px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:24px}
.modal__box h3{font-family:'Playfair Display',serif;color:var(--green);margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.lang-tabs{display:flex;gap:6px;margin:14px 0 10px}
.lang-tab{padding:6px 14px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;font-weight:700;font-size:.85rem}
.lang-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.modal__foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:640px){.grid3{grid-template-columns:1fr}.tour-item{flex-wrap:wrap}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="loginView">
  <div class="login__box">
    <div class="login__logo">Chronic<span>Travel</span></div>
    <div class="login__sub">Admin panelга kirish</div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="admin@chronic.uz" autocomplete="username"></div>
    <div class="field"><label>Parol</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn--gold" id="loginBtn" style="width:100%;justify-content:center">Kirish</button>
    <div class="msg msg--err" id="loginMsg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <div class="top">
    <div class="top__logo">Chronic<span>Travel</span> · Admin</div>
    <div class="top__right">
      <a href="/" target="_blank" style="color:#fff">🌐 Saytni ochish</a>
      <span id="whoami" style="opacity:.8"></span>
      <button class="btn btn--sm btn--ghost" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.4)">Chiqish</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-tab="tours">📦 Turlar</div>
      <div class="tab" data-tab="orders">📩 Buyurtmalar</div>
      <div class="tab" data-tab="settings">⚙️ Sozlamalar</div>
    </div>

    <!-- TURLAR -->
    <section id="tab-tours">
      <div class="panel-head">
        <h2>Turlar</h2>
        <div style="display:flex;gap:8px">
          <button class="btn btn--ghost btn--sm" id="importBtn">⤵️ Namunaviy turlarni import qilish</button>
          <button class="btn btn--gold btn--sm" id="addTourBtn">+ Yangi tur</button>
        </div>
      </div>
      <div id="toursList"></div>
    </section>

    <!-- BUYURTMALAR -->
    <section id="tab-orders" class="hidden">
      <div class="panel-head">
        <h2>Buyurtmalar</h2>
        <button class="btn btn--ghost btn--sm" id="refreshOrders">↻ Yangilash</button>
      </div>
      <div class="card" style="padding:0;overflow:auto">
        <table>
          <thead><tr><th>Sana</th><th>Ism</th><th>Telefon</th><th>Tur</th><th>Holat</th><th></th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <p class="muted" id="ordersEmpty" style="margin-top:12px"></p>
    </section>

    <!-- SOZLAMALAR -->
    <section id="tab-settings" class="hidden">
      <div class="panel-head"><h2>Sozlamalar (matnlar)</h2></div>
      <div class="card">
        <div class="field"><label>Telefon raqami</label><input id="set_phone" placeholder="+998 ..."></div>
        <div class="field"><label>Hero matn (UZ)</label><textarea id="set_hero_text_uz" rows="3"></textarea></div>
        <div class="field"><label>Hero matn (RU)</label><textarea id="set_hero_text_ru" rows="3"></textarea></div>
        <div class="field"><label>Hero matn (EN)</label><textarea id="set_hero_text_en" rows="3"></textarea></div>
        <button class="btn btn--gold" id="saveSettings">Saqlash</button>
        <span class="msg" id="settingsMsg"></span>
      </div>
    </section>
  </div>
</div>

<!-- ============ TUR MODAL ============ -->
<div class="modal hidden" id="tourModal">
  <div class="modal__box">
    <h3 id="modalTitle">Yangi tur</h3>
    <input type="hidden" id="t_id">
    <div class="grid3">
      <div><label>Rasm (URL)</label><input id="t_image" placeholder="https://..."></div>
      <div><label>Narx</label><input id="t_price" placeholder="$890"></div>
      <div><label>Tartib (sort)</label><input id="t_sort" type="number" value="0"></div>
    </div>
    <div style="margin-top:10px"><img id="t_preview" src="" alt="" style="max-height:90px;border-radius:8px;display:none"></div>

    <div class="lang-tabs">
      <div class="lang-tab active" data-l="uz">UZ</div>
      <div class="lang-tab" data-l="ru">RU</div>
      <div class="lang-tab" data-l="en">EN</div>
    </div>
    <div id="langFields"></div>

    <label style="margin-top:12px"><input type="checkbox" id="t_active" checked style="width:auto;margin-right:6px">Faol (saytda ko'rinsin)</label>

    <div class="modal__foot">
      <button class="btn btn--ghost" id="cancelTour">Bekor qilish</button>
      <button class="btn btn--gold" id="saveTour">Saqlash</button>
    </div>
    <div class="msg msg--err" id="tourMsg" style="text-align:right"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
